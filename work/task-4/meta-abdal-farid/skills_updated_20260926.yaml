  # =======================================================================================
  # Added in Task 4 by Nayab Khalid (NVIDIA), 2026-09-20. Proposed for team ratification.
  #
  # Why: the starter taxonomy was written for job DESCRIPTIONS, where tool names appear
  # (AWS, Docker, Spark). Members whose source carries only job TITLES cannot match it:
  # measured against 1,745 NVIDIA titles it reached 21.2% of postings and 0.24 skills per
  # posting. Titles name the specialisation, not the tool - "Senior Physical Design
  # Engineer", not "Verilog, Synopsys, PrimeTime".
  #
  # These entries therefore add the specialisation vocabulary that titles do carry. They
  # are skills in a hiring-intelligence sense: they say what the team builds. Role words
  # (engineer, manager, architect) are deliberately NOT here - those are role_function,
  # derived in Task 3.
  # =======================================================================================

  # ---- silicon and hardware specialisations
  - name: Physical Design
    category: silicon_design
    aliases: [physical design, place and route, floorplanning, pnr]
  - name: RTL Design
    category: silicon_design
    aliases: [rtl, logic synthesis, digital logic, verilog, systemverilog, vhdl]
  - name: Silicon Verification
    category: silicon_design
    aliases: [verification, dv, design verification, formal verification, post silicon]
  - name: SoC Design
    category: silicon_design
    aliases: [soc, system on chip, chip design, asic design]
  - name: Analog and Mixed Signal
    category: silicon_design
    aliases: [mixed signal, analog, circuit design, serdes, pll]
  - name: Signal and Power Integrity
    category: silicon_design
    aliases: [signal integrity, power integrity, power delivery, thermal, packaging]
  - name: Design for Test
    category: silicon_design
    aliases: [dft, scan, atpg]
  - name: CPU Architecture
    category: silicon_design
    aliases: [cpu, processor architecture, microarchitecture]
  - name: GPU Architecture
    category: silicon_design
    aliases: [gpu architecture, graphics architecture, tensor core]

  # ---- systems and platform software
  - name: Firmware
    category: hardware_systems
    aliases: [firmware, bios, bmc, bringup, board support]
  # "driver" was removed after validation (Task 4, Abdal Farid / Meta, 2026-09-26): all 49
  # matches in the Meta dataset were the identical boilerplate sentence "a key driver of
  # Meta's app growth" (a duplicate/reposted paragraph), zero were about device drivers.
  # "device driver" and "linux kernel" are kept as they did not produce this pattern.
  - name: Kernel and Drivers
    category: hardware_systems
    aliases: [kernel, device driver, linux kernel]
  - name: Compilers
    category: hardware_systems
    aliases: [compiler, llvm, code generation, toolchain]

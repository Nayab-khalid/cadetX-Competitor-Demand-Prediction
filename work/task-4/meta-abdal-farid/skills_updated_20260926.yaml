# Canonical skill taxonomy - ALIGNMENT LOCK #2.
# Rules in docs/skill-taxonomy.md. Add entries by PR only, two approvals. Never rename a canonical
# name once analysis has started - add an alias instead.

version: 0.1.0
status: starter   # expand during Task 4 from the candidate skills each member collects


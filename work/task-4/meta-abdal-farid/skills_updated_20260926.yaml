  - silicon_design      # added Task 4: chip-level specialisations, heavily represented at NVIDIA
  - research_domains
  - product_process

# Terms that must never be matched from a job title alone. Each caused a false positive when the
# taxonomy was first run against NVIDIA titles in Task 4.
#   r  - matched "R&D", which cleans to "r d", in 9 postings. The R language was in none of them.
#   c  - matched the "c" inside "c++" in 11 postings, double-counting C and C++.
# "go" was checked too and kept: it only ever matched "golang" and a genuine "rust go c++" listing.
title_match_blocklist: [r, c]


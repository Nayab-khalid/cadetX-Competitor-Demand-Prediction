    category: hardware_systems
    aliases: [dgx, datacenter, data center, rack scale, cluster management, supercomputer]
  - name: Storage Systems
    category: hardware_systems
    aliases: [storage, filesystem, nvme, object store]
  - name: Performance Engineering
    category: hardware_systems
    aliases: [performance, optimization, optimisation, profiling, benchmarking]


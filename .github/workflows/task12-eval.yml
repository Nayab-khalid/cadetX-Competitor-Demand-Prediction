name: Task 12 - Run skill extractor evaluation

on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pandas

      - name: Run evaluation script
        run: |
          python work/task-12-optional-finetune/meta-abdal-farid/evaluate_extractor.py

      - name: Show output CSVs
        run: |
          echo "===== evaluation_metrics.csv ====="
          cat work/task-12-optional-finetune/meta-abdal-farid/evaluation_metrics.csv || true
          echo ""
          echo "===== evaluation_per_row.csv (head) ====="
          head -6 work/task-12-optional-finetune/meta-abdal-farid/evaluation_per_row.csv || true

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: task12-evaluation-results
          path: |
            work/task-12-optional-finetune/meta-abdal-farid/evaluation_metrics.csv
            work/task-12-optional-finetune/meta-abdal-farid/evaluation_per_row.csv
